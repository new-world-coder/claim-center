global:
  scrape_interval: 15s
scrape_configs:
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080", "auth-service:8081", "tenant-service:8082", "policy-service:8083", "claim-service:8084", "customer-service:8085", "document-service:8086", "notification-service:8087", "audit-service:8088"]
