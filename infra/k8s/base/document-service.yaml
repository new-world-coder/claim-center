apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: claim-center
spec:
  replicas: 2
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      containers:
        - name: document-service
          image: ghcr.io/example/claim-center/document-service:latest
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: claim-center-config
            - secretRef:
                name: claim-center-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: claim-center
spec:
  selector:
    app: document-service
  ports:
    - port: 8086
      targetPort: 8086
