apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-service
  namespace: claim-center
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policy-service
  template:
    metadata:
      labels:
        app: policy-service
    spec:
      containers:
        - name: policy-service
          image: ghcr.io/example/claim-center/policy-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: claim-center-config
            - secretRef:
                name: claim-center-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: policy-service
  namespace: claim-center
spec:
  selector:
    app: policy-service
  ports:
    - port: 8083
      targetPort: 8083
