apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: claim-center
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/example/claim-center/frontend:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: claim-center-config
            - secretRef:
                name: claim-center-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: claim-center
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
