apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: claim-center
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: ghcr.io/example/claim-center/customer-service:latest
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: claim-center-config
            - secretRef:
                name: claim-center-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: claim-center
spec:
  selector:
    app: customer-service
  ports:
    - port: 8085
      targetPort: 8085
