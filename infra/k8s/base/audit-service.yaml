apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: claim-center
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      containers:
        - name: audit-service
          image: ghcr.io/example/claim-center/audit-service:latest
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: claim-center-config
            - secretRef:
                name: claim-center-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: claim-center
spec:
  selector:
    app: audit-service
  ports:
    - port: 8088
      targetPort: 8088
