apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
  namespace: claim-center
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tenant-service
  template:
    metadata:
      labels:
        app: tenant-service
    spec:
      containers:
        - name: tenant-service
          image: ghcr.io/example/claim-center/tenant-service:latest
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-service
  namespace: claim-center
spec:
  selector:
    app: tenant-service
  ports:
    - port: 8082
      targetPort: 8082
