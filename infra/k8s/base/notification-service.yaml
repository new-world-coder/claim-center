apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: claim-center
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/example/claim-center/notification-service:latest
          ports:
            - containerPort: 8087
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: claim-center
spec:
  selector:
    app: notification-service
  ports:
    - port: 8087
      targetPort: 8087
