services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: claim_center
      POSTGRES_USER: claimcenter
      POSTGRES_PASSWORD: claimcenter
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimcenter -d claim_center"]
      interval: 5s
      timeout: 5s
      retries: 20
  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/claim_center
      DB_USER: claimcenter
      DB_PASSWORD: claimcenter
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      AUTH_SERVICE_URL: http://auth-service:8081
      TENANT_SERVICE_URL: http://tenant-service:8082
      POLICY_SERVICE_URL: http://policy-service:8083
      CLAIM_SERVICE_URL: http://claim-service:8084
      CUSTOMER_SERVICE_URL: http://customer-service:8085
      DOCUMENT_SERVICE_URL: http://document-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      AUDIT_SERVICE_URL: http://audit-service:8088
    depends_on:
      postgres:
        condition: service_healthy
  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    ports: ["8081:8081"]
