    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.2
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../../observability/grafana:/var/lib/grafana/dashboards
