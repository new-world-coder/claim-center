server:
  port: 8088
spring:
  application:
    name: audit-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claim_center}
    username: ${DB_USER:claimcenter}
    password: ${DB_PASSWORD:claimcenter}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
claimcenter:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef}
  security:
    mode: resource
  tenancy:
    routing: true
