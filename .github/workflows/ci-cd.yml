name: Claim Center CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        run: mvn -B test
      - name: Static analysis and coverage
        run: mvn -B verify -DskipTests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Lint and build
        working-directory: frontend
        run: npm install && npm run lint && npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: SAST
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin, javascript
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

  images:
    needs: [backend, frontend, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -DskipTests package
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose -f infra/docker/docker-compose.yml build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to GKE
        run: |
          gcloud container clusters get-credentials claim-center-gke --region us-central1
          kubectl apply -f infra/k8s/base
          kubectl apply -f infra/k8s/hpa
