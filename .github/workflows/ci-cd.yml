name: Claim Center CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: mvn -q test
      - run: mvn -q verify

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd frontend && npm ci && npm run lint && npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Scan
        run: echo "Run dependency scans (OWASP/Trivy) here"
      - name: SAST
        run: echo "Run CodeQL/Semgrep here"
      - name: DAST
        run: echo "Run ZAP baseline here"

  docker-build-push:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, security-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: echo "Build and push Docker images to Artifact Registry"

  deploy-gke:
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to GKE
        run: echo "Authenticate gcloud and kubectl apply manifests"
